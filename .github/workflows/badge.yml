name: Обновить бейдж версии

# При публикации релиза переписывает badge.json (версия и дата патча),
# который shields.io показывает на странице мода на ap-pro.ru:
# https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/SunChessss/Bolshaya-Zona-ReFix/main/badge.json

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badge
  cancel-in-progress: true

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Собрать badge.json из последнего релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Europe/Moscow
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          published=$(gh release view --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          version="${tag#v}"
          date=$(date -d "$published" +%d.%m.%Y)
          printf '{\n  "schemaVersion": 1,\n  "label": "последний патч",\n  "message": "%s · %s",\n  "color": "4c1",\n  "namedLogo": "github"\n}\n' "$version" "$date" > badge.json
          cat badge.json

      - name: Закоммитить
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badge.json
          git diff --cached --quiet && echo "badge.json не изменился" && exit 0
          git commit -m "badge: $(jq -r .message badge.json)"
          git push
